import base64, os

png_path = "/mnt/data/a_wide_cinematic_space_themed_digital_banner_cove.png"
svg_path = "/mnt/data/Roshan_Jagdesh_CV_Cover.svg"

with open(png_path, "rb") as f:
    encoded = base64.b64encode(f.read()).decode("ascii")

svg = f'''<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1681" height="936" viewBox="0 0 1681 936">
  <image width="1681" height="936"
         preserveAspectRatio="none"
         href="data:image/png;base64,{encoded}"/>
</svg>
'''

with open(svg_path, "w", encoding="utf-8") as f:
    f.write(svg)

print(f"Created: {svg_path}")
print("SVG dimensions: 1681 × 936")
print("Note: the SVG contains the original high-resolution PNG as an embedded image, so the artwork is preserved exactly.")
