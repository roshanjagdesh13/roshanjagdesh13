<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0821"/>
      <stop offset="55%" stop-color="#241b4e"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3a2e78" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a2e78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="140" cy="90" r="1.1" opacity="0.5"/>
    <circle cx="220" cy="35" r="1.4" opacity="0.7"/>
    <circle cx="310" cy="70" r="1" opacity="0.4"/>
    <circle cx="90" cy="180" r="1.3" opacity="0.6"/>
    <circle cx="180" cy="230" r="1" opacity="0.5"/>
    <circle cx="40" cy="250" r="1.5" opacity="0.7"/>
    <circle cx="260" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="960" cy="45" r="1.4" opacity="0.7"/>
    <circle cx="1040" cy="90" r="1" opacity="0.5"/>
    <circle cx="1120" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="1150" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="1000" cy="200" r="1.3" opacity="0.6"/>
    <circle cx="1080" cy="250" r="1" opacity="0.4"/>
    <circle cx="1160" cy="230" r="1.4" opacity="0.6"/>
    <circle cx="600" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="700" cy="260" r="1" opacity="0.4"/>
    <circle cx="500" cy="260" r="1.2" opacity="0.5"/>
  </g>

  <!-- orbit ring -->
  <ellipse cx="1000" cy="150" rx="150" ry="55" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-18 1000 150)"/>
  <circle cx="855" cy="118" r="4" fill="#00E5FF" opacity="0.8"/>

  <!-- rocket, upper right, angled ascent -->
  <g transform="translate(1015,60) rotate(35)">
    <path d="M0,-46 C16,-30 16,10 0,34 C-16,10 -16,-30 0,-46 Z" fill="#E8E8F0"/>
    <path d="M0,-46 C10,-30 10,-6 0,-2 C-10,-6 -10,-30 0,-46 Z" fill="#FFD700"/>
    <circle cx="0" cy="-14" r="7" fill="#0f0c29" stroke="#00E5FF" stroke-width="2"/>
    <path d="M-16,10 L-32,34 L-10,26 Z" fill="#FF5252"/>
    <path d="M16,10 L32,34 L10,26 Z" fill="#FF5252"/>
    <path d="M-9,34 C-9,50 0,66 0,66 C0,66 9,50 9,34 Z" fill="url(#flame)"/>
  </g>

  <!-- title -->
  <text x="70" y="150" font-size="58" font-weight="800" fill="#FFD700" letter-spacing="2">ROSHAN JAGDESH</text>
  <text x="72" y="188" font-size="21" fill="#00E5FF" letter-spacing="1">Building Ideas with Code &amp; AI</text>

  <!-- baseline rule -->
  <line x1="70" y1="210" x2="430" y2="210" stroke="#FFD700" stroke-opacity="0.5" stroke-width="2"/>
  <text x="70" y="235" font-size="14" fill="#8b949e" letter-spacing="3">CS STUDENT · FAST NUCES PESHAWAR · SPACE TECH ENTHUSIAST</text>
</svg>
