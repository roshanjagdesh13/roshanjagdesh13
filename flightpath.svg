<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fpbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0821"/>
      <stop offset="100%" stop-color="#181233"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="14" fill="url(#fpbg)" stroke="#302b63" stroke-width="1.5"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="30" r="1.4" opacity="0.6"/><circle cx="90" cy="60" r="1" opacity="0.4"/>
    <circle cx="1150" cy="40" r="1.5" opacity="0.7"/><circle cx="1100" cy="80" r="1" opacity="0.4"/>
    <circle cx="620" cy="35" r="1.2" opacity="0.5"/><circle cx="720" cy="55" r="1" opacity="0.4"/>
    <circle cx="200" cy="270" r="1.2" opacity="0.5"/><circle cx="980" cy="260" r="1.3" opacity="0.5"/>
    <circle cx="450" cy="270" r="1" opacity="0.4"/><circle cx="850" cy="30" r="1.1" opacity="0.5"/>
  </g>

  <text x="40" y="38" font-size="18" font-weight="800" fill="#FFD700" letter-spacing="2">FLIGHT PATH // TRAJECTORY</text>
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#302b63" stroke-width="1.5"/>

  <!-- trajectory curve -->
  <path d="M100,250 C220,250 260,212 350,208 S500,178 600,175 S760,152 850,145 S1000,135 1100,128"
        fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- waypoint: T+0 -->
  <g>
    <circle cx="100" cy="250" r="7" fill="#FFD700"/>
    <line x1="100" y1="243" x2="100" y2="210" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <text x="100" y="196" font-size="14" font-weight="800" fill="#FFD700" text-anchor="middle">T+0 · LAUNCH</text>
    <text x="100" y="216" font-size="12" fill="#8b949e" text-anchor="middle">Began BS Computer</text>
    <text x="100" y="230" font-size="12" fill="#8b949e" text-anchor="middle">Science @ FAST NUCES</text>
  </g>

  <!-- waypoint: T+1 -->
  <g>
    <circle cx="350" cy="208" r="7" fill="#FFD700"/>
    <line x1="350" y1="201" x2="350" y2="168" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <text x="350" y="154" font-size="14" font-weight="800" fill="#FFD700" text-anchor="middle">T+1</text>
    <text x="350" y="174" font-size="12" fill="#8b949e" text-anchor="middle">Built foundations in</text>
    <text x="350" y="188" font-size="12" fill="#8b949e" text-anchor="middle">C, C++ &amp; Python</text>
  </g>

  <!-- waypoint: T+2 -->
  <g>
    <circle cx="600" cy="175" r="7" fill="#FFD700"/>
    <line x1="600" y1="168" x2="600" y2="130" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <text x="600" y="116" font-size="14" font-weight="800" fill="#FFD700" text-anchor="middle">T+2</text>
    <text x="600" y="136" font-size="12" fill="#8b949e" text-anchor="middle">Expanded into AI &amp;</text>
    <text x="600" y="150" font-size="12" fill="#8b949e" text-anchor="middle">Software Development</text>
  </g>

  <!-- waypoint: T+3 -->
  <g>
    <circle cx="850" cy="145" r="7" fill="#FFD700"/>
    <line x1="850" y1="138" x2="850" y2="98" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
    <text x="850" y="84" font-size="14" font-weight="800" fill="#FFD700" text-anchor="middle">T+3</text>
    <text x="850" y="104" font-size="12" fill="#8b949e" text-anchor="middle">Exploring Space Tech</text>
    <text x="850" y="118" font-size="12" fill="#8b949e" text-anchor="middle">&amp; Mobile Development</text>
  </g>

  <!-- waypoint: NOW -->
  <g transform="translate(1100,128)">
    <circle r="9" fill="none" stroke="#00E676" stroke-width="2.5"/>
    <circle r="4" fill="#00E676"/>
    <line x1="0" y1="-9" x2="0" y2="-48" stroke="#00E676" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="-62" font-size="14" font-weight="800" fill="#00E676" text-anchor="middle">NOW</text>
    <text x="0" y="-42" font-size="12" fill="#8b949e" text-anchor="middle">Building projects,</text>
    <text x="0" y="-28" font-size="12" fill="#8b949e" text-anchor="middle">open to research</text>
  </g>
</svg>
